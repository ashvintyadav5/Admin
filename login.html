<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f6f9; margin: 0; }
    .login-card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 320px; text-align: center; }
    h2 { margin-bottom: 1.5rem; color: #333; }
    input { width: 100%; padding: 12px; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button { width: 100%; padding: 12px; background: #111; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
    button:hover { background: #333; }
    .error { color: #e53e3e; margin-top: 10px; font-size: 13px; display: none; }
    .back { display: block; margin-top: 15px; font-size: 13px; color: #666; text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email ID" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" id="loginBtn">Login</button>
      <p id="errorMsg" class="error">गलत User ID या Password!</p>
    </form>
    <a href="index.html" class="back">← गैलरी पर वापस जाएँ</a>
  </div>

  <script type="module">
    import { supabase } from './supabase-config.js';

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginBtn.innerText = 'Logging in...';
      errorMsg.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        errorMsg.innerText = error.message;
        errorMsg.style.display = 'block';
        loginBtn.innerText = 'Login';
      } else {
        window.location.href = 'admin.html';
      }
    });
  </script>
</body>
</html>
