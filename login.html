<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      background: #f4f6f9; 
      margin: 0; 
    }
    .login-card { 
      background: white; 
      padding: 2.5rem 2rem; 
      border-radius: 12px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
      width: 320px; 
      text-align: center; 
    }
    h2 { 
      margin-top: 0;
      margin-bottom: 1.5rem; 
      color: #222; 
      font-size: 22px;
    }
    .input-group {
      margin-bottom: 1rem;
      text-align: left;
    }
    label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 5px;
      font-weight: 500;
    }
    input { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid #d1d5db; 
      border-radius: 8px; 
      box-sizing: border-box; 
      font-size: 15px; 
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #111;
    }
    button { 
      width: 100%; 
      padding: 12px; 
      background: #111; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-weight: 600; 
      cursor: pointer; 
      font-size: 15px; 
      margin-top: 5px;
      transition: background 0.2s;
    }
    button:hover { 
      background: #333; 
    }
    button:disabled {
      background: #888;
      cursor: not-allowed;
    }
    .error { 
      color: #e53e3e; 
      margin-top: 12px; 
      font-size: 13px; 
      display: none; 
      background: #fff5f5;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #fed7d7;
    }
    .back { 
      display: inline-block; 
      margin-top: 18px; 
      font-size: 13px; 
      color: #666; 
      text-decoration: none; 
    }
    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <div class="input-group">
        <label for="username">Username / Email</label>
        <input type="text" id="username" placeholder="Insert User Id " required autocomplete="username">
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Type password " required autocomplete="current-password">
      </div>
      <button type="submit" id="loginBtn">Login</button>
      <div id="errorMsg" class="error"></div>
    </form>
    <a href="index.html" class="back">← गैलरी पर वापस जाएँ</a>
  </div>

  <script type="module">
    import { supabase } from './supabase-config.js';

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginBtn.disabled = true;
      loginBtn.innerText = 'Logging in...';
      errorMsg.style.display = 'none';

      let inputVal = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      // अगर इनपुट में पहले से @ नहीं है, तो अपने आप @gmail.com जोड़ देगा
      let finalEmail = inputVal;
      if (!inputVal.includes('@')) {
        finalEmail = inputVal + '@gmail.com';
      }

      const { data, error } = await supabase.auth.signInWithPassword({
        email: finalEmail,
        password: password,
      });

      if (error) {
        errorMsg.innerText = error.message;
        errorMsg.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.innerText = 'Login';
      } else {
        window.location.href = 'admin.html';
      }
    });
  </script>
</body>
</html>
